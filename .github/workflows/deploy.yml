name: Deploy to SiteGround

# Pushes to `main` deploy the theme + plugin to staging (bighams.yroc.host).
# Production (bighamsbbq.com) deploys only when run manually: Actions → Deploy to
# SiteGround → Run workflow → target: production.
#
# Secrets: SG_SSH_HOST, SG_SSH_USER, SG_SSH_PORT, SG_SSH_PRIVATE_KEY,
# SG_SSH_KEY_PASSPHRASE (optional), SG_SSH_KNOWN_HOSTS (optional), SG_REMOTE_PATH
# (staging) and SG_PROD_REMOTE_PATH (production). If the live site has its own
# SiteGround SSH login, add SG_PROD_SSH_HOST / _USER / _PORT / _PRIVATE_KEY /
# _KEY_PASSPHRASE; any that are missing fall back to the staging values.
on:
  push:
    branches: [main]
    paths:
      - "wp-content/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Which site to deploy to"
        type: choice
        options: [staging, production]
        default: staging
      menu_import:
        description: "Toast menu import after deploy"
        type: choice
        options: [none, preview, apply]
        default: none
      toast_resync_days:
        description: "Re-sync this many days of Toast sales + upcoming catering/events (0 = skip)"
        type: string
        default: "0"
      toast_inspect:
        description: "Print a read-only Toast order breakdown (no guest data)"
        type: boolean
        default: false
      go_live:
        description: "Launch: switch the copied site from bighams.yroc.host to the live URL (production only)"
        type: boolean
        default: false
      live_url:
        description: "Live URL for go_live"
        type: string
        default: "https://bighamsbbq.com"

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: none
      - name: PHP syntax check
        run: |
          set +e
          find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l > lint.txt 2>&1
          status=$?
          grep -v '^No syntax errors' lint.txt
          exit $status

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          TARGET: ${{ github.event.inputs.target || 'staging' }}
          S_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          S_PASS: ${{ secrets.SG_SSH_KEY_PASSPHRASE }}
          S_HOST: ${{ secrets.SG_SSH_HOST }}
          S_USER: ${{ secrets.SG_SSH_USER }}
          S_PORT: ${{ secrets.SG_SSH_PORT }}
          S_PATH: ${{ secrets.SG_REMOTE_PATH }}
          P_KEY: ${{ secrets.SG_PROD_SSH_PRIVATE_KEY }}
          P_PASS: ${{ secrets.SG_PROD_SSH_KEY_PASSPHRASE }}
          P_HOST: ${{ secrets.SG_PROD_SSH_HOST }}
          P_USER: ${{ secrets.SG_PROD_SSH_USER }}
          P_PORT: ${{ secrets.SG_PROD_SSH_PORT }}
          P_PATH: ${{ secrets.SG_PROD_REMOTE_PATH }}
          KNOWN_HOSTS: ${{ secrets.SG_SSH_KNOWN_HOSTS }}
        run: |
          if [ "$TARGET" = "production" ]; then
            if [ -n "$P_KEY" ]; then KEY="$P_KEY"; PASS="$P_PASS"; else KEY="$S_KEY"; PASS="$S_PASS"; fi
            HOST="${P_HOST:-$S_HOST}"; DUSER="${P_USER:-$S_USER}"; PORT="${P_PORT:-$S_PORT}"; REMOTE="$P_PATH"
          else
            KEY="$S_KEY"; PASS="$S_PASS"; HOST="$S_HOST"; DUSER="$S_USER"; PORT="$S_PORT"; REMOTE="$S_PATH"
          fi
          for v in KEY HOST DUSER REMOTE; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v when deploying to $TARGET (production needs SG_PROD_REMOTE_PATH)."; exit 1; fi
          done
          echo "Deploying to: $TARGET"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Keys generated inside SiteGround have a passphrase: strip it on the runner only.
          if [ -n "$PASS" ]; then
            ssh-keygen -p -q -P "$PASS" -N "" -f ~/.ssh/deploy_key
          fi
          PORT="${PORT:-18765}"
          if [ -n "$KNOWN_HOSTS" ] && [ "$HOST" = "$S_HOST" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts
          { echo "DHOST=$HOST"; echo "DUSER=$DUSER"; echo "DPORT=$PORT"; echo "DREMOTE=$REMOTE"; echo "DTARGET=$TARGET"; } >> "$GITHUB_ENV"

      - name: Sync theme and plugin
        run: |
          HOST="$DHOST"; USER="$DUSER"; PORT="$DPORT"; REMOTE="$DREMOTE"
          # Accept /home/<user>/www/site/public_html, ~/www/site/public_html, /www/site/public_html or www/site/public_html.
          REL="${REMOTE#\~}"; REL="${REL#/}"
          RESOLVED=$(ssh -i ~/.ssh/deploy_key -p "${PORT:-18765}" "$USER@$HOST" \
            "for p in '$REMOTE' \"\$HOME/$REL\"; do if [ -d \"\$p/wp-content\" ]; then cd \"\$p\" && pwd; exit 0; fi; done; exit 1") || RESOLVED=""
          if [ -z "$RESOLVED" ] && [ "${DTARGET:-staging}" = "production" ]; then
            # Path secret wrong/empty: use the single bighamsbbq.com install the production login can see.
            FOUND=$(ssh -i ~/.ssh/deploy_key -p "${PORT:-18765}" "$USER@$HOST" 'find -L "$HOME/www" -maxdepth 3 -type d -name wp-content 2>/dev/null | sed "s#/wp-content\$##"' | grep -i bighamsbbq || true)
            if [ "$(printf '%s\n' "$FOUND" | grep -c .)" = "1" ]; then
              RESOLVED="$FOUND"; echo "::warning::SG_PROD_REMOTE_PATH did not match; using the bighamsbbq.com install found. Update the secret to: $FOUND"
            fi
          fi
          if [ -z "$RESOLVED" ]; then
            echo "::error::No WordPress found at SG_REMOTE_PATH. WordPress installs found on this account (use the folder that contains wp-content):"
            ssh -i ~/.ssh/deploy_key -p "${PORT:-18765}" "$USER@$HOST" \
              'find -L "$HOME/www" -maxdepth 3 -type d -name wp-content 2>/dev/null | sed "s#/wp-content\$##" | sed "s#^$HOME#~#"'
            exit 1
          fi
          echo "Deploying to WordPress at: $RESOLVED"
          echo "WP_ROOT=$RESOLVED" >> "$GITHUB_ENV"
          REMOTE="$RESOLVED"
          SSH="ssh -i ~/.ssh/deploy_key -p ${PORT:-18765} -o StrictHostKeyChecking=yes"
          # --delete is scoped to our own folders only; uploads, other plugins and wp-config are never touched.
          for dir in themes/bighams plugins/bighams-core; do
            rsync -az --delete --exclude '.DS_Store' --exclude 'node_modules' \
              -e "$SSH" "wp-content/$dir/" "$USER@$HOST:$REMOTE/wp-content/$dir/"
          done

      - name: Post-deploy (flush caches)
        env:
          TARGET: ${{ github.event.inputs.target || 'staging' }}
          GO_LIVE: ${{ github.event.inputs.go_live || 'false' }}
          LIVE_URL: ${{ github.event.inputs.live_url || 'https://bighamsbbq.com' }}
          MENU_IMPORT: ${{ github.event.inputs.menu_import || 'none' }}
          TOAST_INSPECT: ${{ github.event.inputs.toast_inspect || 'false' }}
          TOAST_RESYNC: ${{ github.event.inputs.toast_resync_days || '0' }}
        run: |
          if [ "$GO_LIVE" = "true" ] && [ "$TARGET" != "production" ]; then echo "::error::go_live only runs with target: production"; exit 1; fi
          ssh -i ~/.ssh/deploy_key -p "$DPORT" "$DUSER@$DHOST" bash -s -- "$WP_ROOT" "$MENU_IMPORT" "$TOAST_INSPECT" "$TOAST_RESYNC" "$TARGET" "$GO_LIVE" "$LIVE_URL" <<'REMOTE_SCRIPT'
          set -e
          cd "$1"
          if [ "$6" = "true" ]; then wp bighams go-live --to="$7"; fi
          echo "WordPress home: $(wp option get home)"
          wp plugin activate bighams-core
          wp theme activate bighams
          echo "Active theme: $(wp theme list --status=active --field=name)"
          echo "Active plugins: $(wp plugin list --status=active --field=name | tr '\n' ' ')"
          wp bighams import-images || echo "::warning::Photo import had problems (see above)"
          case "$4" in ''|0|*[!0-9]*) ;; *) wp bighams toast-sync --days="$4" --upcoming=30 ;; esac
          if [ "$3" = "true" ]; then wp bighams toast-inspect --days=60 --ahead=21 || true; fi
          case "$2" in
            preview) wp bighams toast-menu --dry-run ;;
            apply)   wp bighams toast-menu --dry-run && wp bighams toast-menu && wp bighams import-images ;;
          esac
          wp rewrite flush
          wp cache flush
          wp sg purge 2>/dev/null || true
          if [ "$5" = "production" ]; then wp bighams launch-check || true; fi
          REMOTE_SCRIPT
