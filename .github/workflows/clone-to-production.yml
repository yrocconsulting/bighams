name: Copy staging to production (launch)

# One-time launch copy: bighams.yroc.host (staging) -> bighamsbbq.com (production).
# Copies the database and wp-content (media, themes, plugins) through the GitHub
# runner, keeps production's own wp-config.php (database login, salts), backs up
# production's database first, then switches every staging URL to the live URL.
# DNS and SSL are not touched.
#
# Uses the same secrets as the deploy workflow:
#   staging:    SG_SSH_HOST / _USER / _PORT / _PRIVATE_KEY / _KEY_PASSPHRASE, SG_REMOTE_PATH
#   production: SG_PROD_REMOTE_PATH, and SG_PROD_SSH_HOST / _USER / _PORT /
#               _PRIVATE_KEY / _KEY_PASSPHRASE where they differ from staging.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type COPY to overwrite the production site with staging'
        required: true
        type: string
      live_url:
        description: "Live URL"
        type: string
        default: "https://bighamsbbq.com"
      staging_url:
        description: "Staging URL"
        type: string
        default: "https://bighams.yroc.host"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  copy:
    if: github.event.inputs.confirm == 'COPY'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Configure SSH for both sites
        env:
          S_KEY: ${{ secrets.SG_SSH_PRIVATE_KEY }}
          S_PASS: ${{ secrets.SG_SSH_KEY_PASSPHRASE }}
          S_HOST: ${{ secrets.SG_SSH_HOST }}
          S_USER: ${{ secrets.SG_SSH_USER }}
          S_PORT: ${{ secrets.SG_SSH_PORT }}
          P_KEY: ${{ secrets.SG_PROD_SSH_PRIVATE_KEY }}
          P_PASS: ${{ secrets.SG_PROD_SSH_KEY_PASSPHRASE }}
          P_HOST: ${{ secrets.SG_PROD_SSH_HOST }}
          P_USER: ${{ secrets.SG_PROD_SSH_USER }}
          P_PORT: ${{ secrets.SG_PROD_SSH_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$S_KEY" > ~/.ssh/staging_key && chmod 600 ~/.ssh/staging_key
          [ -n "$S_PASS" ] && ssh-keygen -p -q -P "$S_PASS" -N "" -f ~/.ssh/staging_key
          if [ -n "$P_KEY" ]; then
            printf '%s\n' "$P_KEY" > ~/.ssh/prod_key && chmod 600 ~/.ssh/prod_key
            [ -n "$P_PASS" ] && ssh-keygen -p -q -P "$P_PASS" -N "" -f ~/.ssh/prod_key
          else
            cp ~/.ssh/staging_key ~/.ssh/prod_key
          fi
          PH="${P_HOST:-$S_HOST}"; PU="${P_USER:-$S_USER}"; PP="${P_PORT:-$S_PORT}"
          for v in S_HOST S_USER PH PU; do [ -n "${!v}" ] || { echo "::error::Missing SSH secret ($v)"; exit 1; }; done
          ssh-keyscan -p "${S_PORT:-18765}" "$S_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keyscan -p "${PP:-18765}" "$PH" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host staging
            HostName $S_HOST
            User $S_USER
            Port ${S_PORT:-18765}
            IdentityFile ~/.ssh/staging_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          Host prod
            HostName $PH
            User $PU
            Port ${PP:-18765}
            IdentityFile ~/.ssh/prod_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config
          ssh staging true && ssh prod true && echo "Connected to both sites."

      - name: Find both WordPress installs
        env:
          S_PATH: ${{ secrets.SG_REMOTE_PATH }}
          P_PATH: ${{ secrets.SG_PROD_REMOTE_PATH }}
        run: |
          set -e
          resolve() {
            local host="$1" path="$2" rel
            rel="${path#\~}"; rel="${rel#/}"
            ssh "$host" "for p in '$path' \"\$HOME/$rel\"; do if [ -f \"\$p/wp-config.php\" ] || [ -f \"\$p/../wp-config.php\" ]; then cd \"\$p\" && pwd; exit 0; fi; done; exit 1"
          }
          [ -n "$P_PATH" ] || { echo "::error::Add the SG_PROD_REMOTE_PATH secret"; exit 1; }
          S_ROOT=$(resolve staging "$S_PATH") || { echo "::error::No WordPress at SG_REMOTE_PATH on staging"; exit 1; }
          P_ROOT=$(resolve prod "$P_PATH") || {
            echo "::error::No WordPress at SG_PROD_REMOTE_PATH. WordPress installs this production login can see:"
            ssh prod 'find -L "$HOME/www" -maxdepth 3 -name wp-config.php 2>/dev/null | sed "s#/wp-config.php##; s#^$HOME#~#"'
            exit 1; }
          S_ID="$(ssh staging "hostname; cd '$S_ROOT' && pwd -P")"
          P_ID="$(ssh prod "hostname; cd '$P_ROOT' && pwd -P")"
          if [ "$S_ID" = "$P_ID" ]; then
            echo "::error::Production path points at the staging site. Refusing to copy onto itself."; exit 1
          fi
          echo "Staging:    $S_ROOT ($(ssh staging "cd '$S_ROOT' && wp option get home"))"
          echo "Production: $P_ROOT ($(ssh prod "cd '$P_ROOT' && wp option get home"))"
          { echo "S_ROOT=$S_ROOT"; echo "P_ROOT=$P_ROOT"; } >> "$GITHUB_ENV"

      - name: Back up production database
        run: |
          set -e
          STAMP=$(date +%Y%m%d-%H%M%S)
          ssh prod "mkdir -p ~/bighams-backups && cd '$P_ROOT' && wp db export ~/bighams-backups/before-launch-$STAMP.sql --quiet && gzip -f ~/bighams-backups/before-launch-$STAMP.sql && ls -lh ~/bighams-backups | tail -3"

      - name: Copy database (staging -> production)
        run: |
          set -eo pipefail
          S_PREFIX=$(ssh staging "cd '$S_ROOT' && wp config get table_prefix")
          P_PREFIX=$(ssh prod "cd '$P_ROOT' && wp config get table_prefix")
          echo "Table prefix: staging=$S_PREFIX production=$P_PREFIX"
          ssh staging "cd '$S_ROOT' && wp db export - --single-transaction --quiet" | gzip -c > staging.sql.gz
          ls -lh staging.sql.gz
          gunzip -c staging.sql.gz | ssh prod "cd '$P_ROOT' && wp db import - --quiet"
          if [ "$S_PREFIX" != "$P_PREFIX" ]; then
            ssh prod "cd '$P_ROOT' && wp config set table_prefix '$S_PREFIX' --type=variable --quiet"
            echo "Production now uses table prefix $S_PREFIX (the blank install's $P_PREFIX tables are left in place, unused)."
          fi
          rm -f staging.sql.gz
          echo "Production now reports home: $(ssh prod "cd '$P_ROOT' && wp option get home --skip-plugins --skip-themes")"

      - name: Copy media, themes and plugins
        run: |
          set -e
          EXCL="--exclude cache/ --exclude upgrade/ --exclude '*.log' --exclude ai1wm-backups/ --exclude updraft/ --exclude sg-cachepress/temp/ --exclude .DS_Store"
          mkdir -p wpc
          rsync -az --delete $EXCL -e ssh "staging:$S_ROOT/wp-content/" wpc/
          du -sh wpc
          rsync -az $EXCL -e ssh wpc/ "prod:$P_ROOT/wp-content/"
          echo "wp-content copied."

      - name: Switch to the live address and check
        env:
          LIVE_URL: ${{ github.event.inputs.live_url }}
          STAGING_URL: ${{ github.event.inputs.staging_url }}
        run: |
          ssh prod bash -s -- "$P_ROOT" "$STAGING_URL" "$LIVE_URL" <<'REMOTE'
          set -e
          cd "$1"
          wp plugin activate bighams-core --quiet
          wp theme activate bighams --quiet
          wp bighams go-live --from="$2" --to="$3"
          wp rewrite flush
          wp cache flush
          wp sg purge 2>/dev/null || true
          echo "Home is now: $(wp option get home)"
          wp bighams launch-check || true
          REMOTE
